name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: make test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run make test
        run: make test

  test_coverage:
    name: make test_cover
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run make test_cover
        run: make test_cover
